<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="monospace" font-size="13">
  <style>
    rect.ep { fill: #1a1a2e; stroke: #e94560; stroke-width: 2; rx: 6; }
    rect.epi { fill: #16213e; stroke: #0f3460; stroke-width: 2; rx: 6; }
    rect.file { fill: #1a1a2e; stroke: #533483; stroke-width: 2; rx: 6; }
    text { fill: #e0e0e0; }
    text.title { fill: #e94560; font-weight: bold; font-size: 14px; }
    text.field { fill: #a0a0a0; font-size: 12px; }
    text.label { fill: #ffcc00; font-size: 11px; }
    line, path { stroke: #e0e0e0; stroke-width: 1.5; fill: none; }
    line.uaf { stroke: #ff4444; stroke-width: 2.5; stroke-dasharray: 6,3; }
    marker { fill: #e0e0e0; }
    marker.uaf { fill: #ff4444; }
    rect.bg { fill: #0d1117; }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff4444"/>
    </marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffcc00"/>
    </marker>
  </defs>

  <rect class="bg" width="820" height="520" rx="8"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">epoll_ctl(ep_A, EPOLL_CTL_ADD, ep_B_fd)</text>

  <!-- ep_A (eventpoll) -->
  <rect class="ep" x="30" y="60" width="220" height="180"/>
  <text class="title" x="140" y="82" text-anchor="middle">struct eventpoll (ep_A)</text>
  <text class="field" x="45" y="105">mtx</text>
  <text class="field" x="45" y="122">rbr (RB tree root)</text>
  <line x1="185" y1="117" x2="280" y2="170" marker-end="url(#arr)"/>
  <text class="field" x="45" y="139">refs (hlist head)</text>
  <text class="field" x="45" y="156">gen              /* +168 */</text>
  <text class="field" x="45" y="173">refs.first       /* +176 */</text>
  <text class="field" x="45" y="190">loop_check_depth /* +184 */</text>
  <text class="field" x="45" y="207">refcount</text>
  <text class="field" x="45" y="224">size: 200 → kmalloc-256</text>

  <!-- ep_B (eventpoll) -->
  <rect class="ep" x="570" y="60" width="220" height="180"/>
  <text class="title" x="680" y="82" text-anchor="middle">struct eventpoll (ep_B)</text>
  <text class="field" x="585" y="105">mtx</text>
  <text class="field" x="585" y="122">rbr</text>
  <text class="field" x="585" y="139">refs (hlist head)</text>
  <line x1="585" y1="134" x2="530" y2="190" marker-end="url(#arr-yellow)" stroke="#ffcc00" stroke-width="1.5"/>
  <text class="field" x="585" y="156">gen              /* +168 */</text>
  <text class="field" x="585" y="173">refs.first       /* +176 */</text>
  <text class="field" x="585" y="190">loop_check_depth /* +184 */</text>
  <text class="field" x="585" y="207">refcount</text>
  <text class="field" x="585" y="224">kfree(ep_B) ← THE BUG</text>

  <!-- epitem -->
  <rect class="epi" x="290" y="140" width="230" height="150"/>
  <text class="title" x="405" y="162" text-anchor="middle">struct epitem</text>
  <text class="field" x="305" y="185">rbn (RB node)     → in ep_A.rbr</text>
  <text class="field" x="305" y="205">ep = ep_A         /* +72 */</text>
  <text class="field" x="305" y="225">ffd.file = ep_B_file</text>
  <text class="field" x="305" y="245">fllink (hlist)    → in ep_B.refs</text>
  <text class="field" x="305" y="265">freed via call_rcu (safe)</text>

  <!-- ep pointer back to ep_A -->
  <line x1="305" y1="200" x2="250" y2="155" marker-end="url(#arr)"/>

  <!-- fllink into ep_B.refs -->
  <text class="label" x="460" y="195" text-anchor="middle">epi->ep</text>

  <!-- The UAF arrow -->
  <line class="uaf" x1="405" y1="200" x2="570" y2="155" marker-end="url(#arr-red)"/>
  <text x="490" y="162" fill="#ff4444" font-size="11" font-weight="bold">UAF: epi->ep</text>
  <text x="490" y="175" fill="#ff4444" font-size="11">after kfree(ep_B)</text>

  <!-- The walker path -->
  <rect x="30" y="330" width="760" height="170" fill="none" stroke="#333" stroke-width="1" rx="6"/>
  <text x="50" y="355" fill="#ffcc00" font-size="14" font-weight="bold">The graph walk (ep_get_upwards_depth_proc):</text>

  <text class="field" x="50" y="380">1. Start at ep_A</text>
  <text class="field" x="50" y="400">2. Iterate ep_A.refs → but ep_A.refs is not the target here</text>
  <text class="field" x="50" y="420">3. Actually: iterate ep_B.refs (walking upward from ep_B)</text>
  <text class="field" x="50" y="440">4. Find epitem with epi->ep = ep_A (the watcher)</text>
  <text class="field" x="50" y="460">5. Follow epi->ep → reaches ep_A (alive, safe)</text>
  <text class="field" x="50" y="480">6. But if ep_B is freed while we hold a stale epi->ep to it...</text>
  <text x="50" y="496" fill="#ff4444" font-size="12" font-weight="bold">   ...we dereference freed memory. USE AFTER FREE.</text>
</svg>
