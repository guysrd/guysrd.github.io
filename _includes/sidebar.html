<aside class="post-sidebar" id="post-sidebar">
  <nav>
    <h3>Posts</h3>
    <ul>
      {%- for post in site.posts -%}
        <li {% if page.url == post.url %}class="current"{% endif %}>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          <span class="sidebar-date">{{ post.date | date: "%b %Y" }}</span>
        </li>
      {%- endfor -%}
    </ul>
  </nav>
</aside>

<dialog class="posts-sheet" id="posts-sheet">
  <div class="posts-sheet-header">
    <span>Posts</span>
    <button class="posts-sheet-close" id="posts-sheet-close" aria-label="Close">&times;</button>
  </div>
  <ul class="posts-sheet-list">
    {%- for post in site.posts -%}
      <li {% if page.url == post.url %}class="current"{% endif %}>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <span class="posts-sheet-date">{{ post.date | date: "%b %Y" }}</span>
      </li>
    {%- endfor -%}
  </ul>
</dialog>

<script>
(function() {
  var trigger = document.getElementById('posts-bar-trigger');
  var sheet = document.getElementById('posts-sheet');
  var closeBtn = document.getElementById('posts-sheet-close');
  if (!trigger || !sheet) return;
  trigger.addEventListener('click', function() {
    sheet.showModal();
  });
  closeBtn.addEventListener('click', function() {
    sheet.close();
  });
  sheet.addEventListener('click', function(e) {
    if (e.target === sheet) sheet.close();
  });
})();
</script>
