<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="monospace" font-size="12">

  <!-- ============ CROSS-CACHE (left) ============ -->
  <text x="160" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">cross-cache (failed)</text>

  <!-- order-1 box -->
  <rect x="30" y="50" width="120" height="40" rx="4" fill="#e8e0f0" stroke="#888"/>
  <text x="90" y="66" text-anchor="middle" font-size="11" fill="#333">eventpoll</text>
  <text x="90" y="80" text-anchor="middle" font-size="10" fill="#888">order-1 (8KB)</text>

  <!-- down arrow -->
  <line x1="90" y1="90" x2="90" y2="115" stroke="#888" stroke-width="1.5"/>
  <polygon points="90,120 85,112 95,112" fill="#888"/>
  <text x="105" y="108" font-size="9" fill="#888">kfree</text>

  <!-- SLUB -->
  <rect x="30" y="122" width="120" height="30" rx="4" fill="#d0e8f0" stroke="#888"/>
  <text x="90" y="142" text-anchor="middle" font-size="11" fill="#333">SLUB freelist</text>

  <!-- down arrow -->
  <line x1="90" y1="152" x2="90" y2="172" stroke="#888" stroke-width="1.5"/>
  <polygon points="90,177 85,169 95,169" fill="#888"/>

  <!-- PCP -->
  <rect x="30" y="179" width="120" height="30" rx="4" fill="#f0e8d0" stroke="#888"/>
  <text x="90" y="199" text-anchor="middle" font-size="11" fill="#333">PCP order-1</text>

  <!-- down arrow -->
  <line x1="90" y1="209" x2="90" y2="229" stroke="#888" stroke-width="1.5"/>
  <polygon points="90,234 85,226 95,226" fill="#888"/>

  <!-- buddy -->
  <rect x="30" y="236" width="120" height="30" rx="4" fill="#d8f0d0" stroke="#888"/>
  <text x="90" y="256" text-anchor="middle" font-size="11" fill="#333">buddy split</text>

  <!-- down arrow -->
  <line x1="90" y1="266" x2="90" y2="286" stroke="#888" stroke-width="1.5"/>
  <polygon points="90,291 85,283 95,283" fill="#888"/>

  <!-- PTE -->
  <rect x="30" y="293" width="120" height="40" rx="4" fill="#f0d0d0" stroke="#d44" stroke-width="2"/>
  <text x="90" y="309" text-anchor="middle" font-size="11" fill="#d44">PTE page</text>
  <text x="90" y="323" text-anchor="middle" font-size="10" fill="#888">order-0 (4KB)</text>

  <!-- timing label -->
  <text x="200" y="80" font-size="11" fill="#d44" font-weight="bold">~100ms</text>
  <line x1="175" y1="55" x2="175" y2="330" stroke="#d44" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="200" y="200" font-size="10" fill="#d44">walker is done</text>
  <text x="200" y="214" font-size="10" fill="#d44">at 2ms, page</text>
  <text x="200" y="228" font-size="10" fill="#d44">still in SLUB</text>

  <!-- X mark -->
  <text x="90" y="365" text-anchor="middle" font-size="20" fill="#d44">✗</text>
  <text x="90" y="385" text-anchor="middle" font-size="10" fill="#d44">timelines don't overlap</text>

  <!-- ============ SAME-CACHE (right) ============ -->
  <text x="520" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">same-cache (works)</text>

  <!-- freed slot -->
  <rect x="430" y="50" width="180" height="40" rx="4" fill="#e8e0f0" stroke="#888"/>
  <text x="520" y="66" text-anchor="middle" font-size="11" fill="#333">freed eventpoll slot</text>
  <text x="520" y="80" text-anchor="middle" font-size="10" fill="#888">SLUB per-CPU LIFO</text>

  <!-- down arrow -->
  <line x1="520" y1="90" x2="520" y2="125" stroke="#2a2" stroke-width="2"/>
  <polygon points="520,130 515,122 525,122" fill="#2a2"/>
  <text x="555" y="112" font-size="10" fill="#2a2">kmalloc(256)</text>

  <!-- reclaim object -->
  <rect x="430" y="133" width="180" height="55" rx="4" fill="#d8f0d0" stroke="#2a2" stroke-width="2"/>
  <text x="520" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">reclaim object</text>
  <text x="520" y="168" text-anchor="middle" font-size="10" fill="#555">same slot, same CPU</text>
  <text x="520" y="182" text-anchor="middle" font-size="10" fill="#2a2">controls offsets 168/176/184</text>

  <!-- timing label -->
  <text x="520" y="215" text-anchor="middle" font-size="11" fill="#2a2" font-weight="bold">&lt;1μs</text>

  <!-- checkmark -->
  <text x="520" y="260" text-anchor="middle" font-size="20" fill="#2a2">✓</text>
  <text x="520" y="282" text-anchor="middle" font-size="10" fill="#2a2">no order split</text>
  <text x="520" y="296" text-anchor="middle" font-size="10" fill="#2a2">no buddy, no PCP</text>
  <text x="520" y="310" text-anchor="middle" font-size="10" fill="#2a2">exact slot reclaim</text>

  <!-- divider -->
  <line x1="350" y1="30" x2="350" y2="390" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

</svg>
