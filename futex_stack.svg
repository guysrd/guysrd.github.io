<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="monospace" font-size="12">

  <text x="340" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">the stack UAF: futex_q lives and dies on the waiter's stack</text>

  <!-- THREE STATES side by side -->

  <!-- STATE 1: waiter sleeping -->
  <text x="110" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">① waiter sleeping</text>

  <!-- stack frame -->
  <rect x="40" y="65" width="140" height="140" rx="3" fill="#e8e0f0" stroke="#888"/>
  <text x="110" y="85" text-anchor="middle" font-size="10" fill="#555">futex_wait_requeue_pi</text>
  <line x1="50" y1="92" x2="170" y2="92" stroke="#aaa"/>
  <rect x="55" y="98" width="110" height="42" rx="2" fill="#d0c8e8" stroke="#888"/>
  <text x="110" y="114" text-anchor="middle" font-size="10" fill="#333">struct futex_q</text>
  <text x="110" y="130" text-anchor="middle" font-size="9" fill="#555">q.task = current</text>
  <line x1="50" y1="148" x2="170" y2="148" stroke="#aaa"/>
  <text x="110" y="165" text-anchor="middle" font-size="9" fill="#888">rt_waiter</text>
  <text x="110" y="180" text-anchor="middle" font-size="9" fill="#888">timeout</text>
  <text x="110" y="195" text-anchor="middle" font-size="9" fill="#888">...</text>

  <text x="110" y="225" text-anchor="middle" font-size="9" fill="#555">↑ SP points here</text>
  <text x="110" y="245" text-anchor="middle" font-size="10" fill="#2a2">q is alive</text>
  <text x="110" y="259" text-anchor="middle" font-size="10" fill="#2a2">requeuer can read q->task</text>

  <!-- STATE 2: waiter returned -->
  <text x="350" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">② waiter returned</text>

  <rect x="280" y="65" width="140" height="140" rx="3" fill="#f0e0e0" stroke="#d44" stroke-dasharray="5,3"/>
  <text x="350" y="85" text-anchor="middle" font-size="10" fill="#888" text-decoration="line-through">futex_wait_requeue_pi</text>
  <line x1="290" y1="92" x2="410" y2="92" stroke="#daa"/>
  <rect x="295" y="98" width="110" height="42" rx="2" fill="#e8c8c8" stroke="#d44" stroke-dasharray="4,2"/>
  <text x="350" y="114" text-anchor="middle" font-size="10" fill="#d44">struct futex_q</text>
  <text x="350" y="130" text-anchor="middle" font-size="9" fill="#d44">q.task = stale</text>
  <line x1="290" y1="148" x2="410" y2="148" stroke="#daa"/>
  <text x="350" y="165" text-anchor="middle" font-size="9" fill="#ccc">garbage</text>
  <text x="350" y="180" text-anchor="middle" font-size="9" fill="#ccc">garbage</text>
  <text x="350" y="195" text-anchor="middle" font-size="9" fill="#ccc">garbage</text>

  <text x="350" y="225" text-anchor="middle" font-size="9" fill="#555">↑ SP moved up (returned)</text>
  <text x="350" y="245" text-anchor="middle" font-size="10" fill="#d44">q is dead</text>
  <text x="350" y="259" text-anchor="middle" font-size="10" fill="#d44">data still in memory</text>

  <!-- STATE 3: spray overwrites -->
  <text x="570" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">③ spray syscall</text>

  <rect x="500" y="65" width="140" height="140" rx="3" fill="#d8f0d0" stroke="#2a2"/>
  <text x="570" y="85" text-anchor="middle" font-size="10" fill="#555">vmsplice / uname / ...</text>
  <line x1="510" y1="92" x2="630" y2="92" stroke="#8c8"/>
  <rect x="515" y="98" width="110" height="42" rx="2" fill="#b8e8a8" stroke="#2a2" stroke-width="2"/>
  <text x="570" y="114" text-anchor="middle" font-size="10" fill="#333">spray data</text>
  <text x="570" y="130" text-anchor="middle" font-size="9" fill="#2a2">fake task_struct*</text>
  <line x1="510" y1="148" x2="630" y2="148" stroke="#8c8"/>
  <text x="570" y="165" text-anchor="middle" font-size="9" fill="#555">controlled</text>
  <text x="570" y="180" text-anchor="middle" font-size="9" fill="#555">controlled</text>
  <text x="570" y="195" text-anchor="middle" font-size="9" fill="#555">controlled</text>

  <text x="570" y="225" text-anchor="middle" font-size="9" fill="#555">↑ SP at new syscall depth</text>
  <text x="570" y="245" text-anchor="middle" font-size="10" fill="#2a2">old q.task overwritten</text>
  <text x="570" y="259" text-anchor="middle" font-size="10" fill="#2a2">requeuer reads fake ptr</text>

  <!-- arrows between states -->
  <line x1="185" y1="135" x2="275" y2="135" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="128" text-anchor="middle" font-size="9" fill="#888">return</text>

  <line x1="425" y1="135" x2="495" y2="135" stroke="#2a2" stroke-width="1.5" marker-end="url(#arrg)"/>
  <text x="460" y="128" text-anchor="middle" font-size="9" fill="#2a2">spray</text>

  <!-- timeline bar at bottom -->
  <line x1="40" y1="300" x2="640" y2="300" stroke="#888" stroke-width="1"/>
  <text x="110" y="320" text-anchor="middle" font-size="9" fill="#888">requeuer: complete(q,1)</text>
  <text x="350" y="320" text-anchor="middle" font-size="9" fill="#d44">requeuer: INTERRUPTED</text>
  <text x="570" y="320" text-anchor="middle" font-size="9" fill="#2a2">requeuer: wake_up_state(q->task)</text>
  <circle cx="110" cy="300" r="3" fill="#888"/>
  <circle cx="350" cy="300" r="3" fill="#d44"/>
  <circle cx="570" cy="300" r="3" fill="#2a2"/>

  <text x="340" y="342" text-anchor="middle" font-size="10" fill="#888">← interrupt window: 1-10μs →</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a2"/>
    </marker>
  </defs>
</svg>
